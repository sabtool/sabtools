name: Auto Blog Generator

# 3 posts per day, ~7-8 hours apart at fixed UTC times. The script then
# adds a random 0-90 minute delay so the actual publish times vary
# day-to-day — Google rewards organic publish patterns over rigidly-timed
# cadences. Set BLOG_TYPE per cron so each slot produces a different kind
# of post: tool guide / competitor comparison / news & trends.

on:
  schedule:
    # Slot 1: 3:30 AM UTC (9:00 AM IST) — TOOL GUIDE
    - cron: '30 3 * * *'
    # Slot 2: 9:30 AM UTC (3:00 PM IST) — COMPARISON POST
    - cron: '30 9 * * *'
    # Slot 3: 14:30 UTC (8:00 PM IST) — NEWS & TRENDS POST
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      blog_type:
        description: 'Blog post type (tool / comparison / news)'
        required: true
        default: 'tool'
        type: choice
        options:
          - tool
          - comparison
          - news

concurrency:
  group: auto-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Generous timeout: random jitter (up to 90 min) + LLM generation
    # (1-3 min) + screenshot (1-2 min) + commit + indexing.
    timeout-minutes: 130

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Determine blog type
        id: blog-type
        run: |
          # Map the cron schedule to the blog type. Manual triggers use the
          # workflow_dispatch input. Schedule triggers infer the type from
          # the firing cron expression.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BLOG_TYPE="${{ inputs.blog_type }}"
          else
            case "${{ github.event.schedule }}" in
              "30 3 * * *")  BLOG_TYPE="tool" ;;
              "30 9 * * *")  BLOG_TYPE="comparison" ;;
              "30 14 * * *") BLOG_TYPE="news" ;;
              *)             BLOG_TYPE="tool" ;;
            esac
          fi
          echo "BLOG_TYPE=$BLOG_TYPE" >> "$GITHUB_OUTPUT"
          echo "Selected blog type: $BLOG_TYPE"

      - name: Generate blog post
        run: node scripts/blog/generate-blog.js
        env:
          BLOG_TYPE: ${{ steps.blog-type.outputs.BLOG_TYPE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Override the model if cost is a concern. Default is claude-opus-4-7;
          # set to claude-sonnet-4-6 in repo variables for ~50% cost reduction.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-7' }}

      - name: Take screenshot
        # News posts may not have a tool-specific screenshot; the screenshot
        # script handles this gracefully (writes a brand-banner fallback
        # rather than failing the workflow).
        run: node scripts/blog/screenshot.js
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "SabTools Bot"
          git config user.email "bot@sabtools.in"
          git add -A
          BLOG_TYPE="${{ steps.blog-type.outputs.BLOG_TYPE }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          # FAIL LOUDLY when a scheduled run produced no post. Previously
          # this did `exit 0` ("No changes to commit"), which made a dead
          # pipeline look green — the auto-blog silently stopped publishing
          # for 1.5 days (2026-05-20) before anyone noticed. A scheduled
          # run that generates nothing is a real failure: it almost always
          # means the ANTHROPIC_API_KEY secret is missing/expired (the
          # comparison + news composers skip with no fallback when the key
          # is absent). Exit 1 turns the run red so GitHub emails the repo
          # owner instead of the breakage rotting unseen.
          if git diff --cached --quiet; then
            echo "::error::Auto-blog produced NO post. generate-blog.js wrote no files — check the ANTHROPIC_API_KEY repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          git commit -m "blog: auto-publish ${BLOG_TYPE} post ${TIMESTAMP}"
          # Rebase onto any commits that landed on main while this long-
          # running job (jitter sleep + LLM gen) was in flight, so the
          # push can't fail on a non-fast-forward race.
          git pull --rebase origin main
          git push

      - name: Submit to Google Indexing API
        run: node scripts/blog/index-url.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        continue-on-error: true

      # Auto-post the new blog to X (@Sabtoolsin) via X API v2 + OAuth 1.0a.
      # Best-effort: the script always exits 0 and only emits ::warning::
      # annotations on failure, so a missing-credentials or X-outage day
      # never breaks the blog pipeline. Set the 4 X_* secrets in Settings →
      # Secrets and variables → Actions; see scripts/blog/post-to-x.js for
      # the developer.twitter.com setup walkthrough.
      - name: Post to X (Twitter)
        run: node scripts/blog/post-to-x.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        continue-on-error: true
